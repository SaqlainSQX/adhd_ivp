[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "social-gaze-audit"
version = "0.1.0"
description = "Temporal sampling and model-assisted estimation of mutual-looking prevalence"
requires-python = ">=3.11"
dependencies = ["numpy>=2.1,<3", "pandas>=2.2,<3", "scikit-learn>=1.6,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
research = ["h5py>=3.12,<4"]
demo = ["Pillow>=11,<13"]
plots = ["matplotlib>=3.10,<4"]

[project.scripts]
gaze-audit = "gaze_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gaze_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]
